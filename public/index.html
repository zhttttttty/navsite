<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>水果导航</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- PWA Meta Tags -->
  <meta name="application-name" content="水果导航">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="水果导航">
  <meta name="description" content="基于飞书多维表格的个人网站导航工具，支持分类管理、搜索功能、暗黑模式等特性">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-config" content="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#0b0f17">
  <meta name="theme-color" content="#4f46e5">

  <!-- Icons for various devices -->
  <link rel="icon" type="image/x-icon" href="img/logo.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icons/icon-72x72.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icons/icon-72x72.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="144x144" href="img/icons/icon-144x144.png">
  <link rel="apple-touch-icon" sizes="120x120" href="img/icons/icon-128x128.png">
  <link rel="apple-touch-icon" sizes="114x114" href="img/icons/icon-128x128.png">
  <link rel="apple-touch-icon" sizes="76x76" href="img/icons/icon-72x72.png">
  <link rel="apple-touch-icon" sizes="72x72" href="img/icons/icon-72x72.png">
  <link rel="apple-touch-icon" sizes="60x60" href="img/icons/icon-72x72.png">
  <link rel="apple-touch-icon" sizes="57x57" href="img/icons/icon-72x72.png">

  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileImage" content="img/icons/icon-144x144.png">
  <meta name="msapplication-square70x70logo" content="img/icons/icon-72x72.png">
  <meta name="msapplication-square150x150logo" content="img/icons/icon-152x152.png">
  <meta name="msapplication-wide310x150logo" content="img/icons/icon-384x384.png">
  <meta name="msapplication-square310x310logo" content="img/icons/icon-384x384.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
</head>

<body>
  <!-- 粒子背景容器 -->
  <div class="particles"></div>
  <!-- 移动端顶部导航栏 -->
  <header class="mobile-header">
    <div class="mobile-nav">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="打开菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="mobile-logo">
        <img src="./img/logo.png" alt="水果导航">
        <span>水果导航</span>
      </div>
      <div class="mobile-actions">
        <button id="theme-toggle-btn" class="theme-toggle-button" title="切换暗黑模式" aria-label="切换暗黑模式">
          <i class="bi bi-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 右上角模式切换按钮（桌面端显示） -->
  <button id="desktop-theme-toggle-btn" class="theme-toggle-button desktop-only" title="切换暗黑模式" aria-label="切换暗黑模式">
    <i class="bi bi-moon"></i>
  </button>

  <!-- 移动端遮罩层 -->
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <div class="container">
    <!-- 左侧侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="user-avatar">
        <img src="./img/logo.png" alt="水果导航">
      </div>
      <nav class="nav-menu">
        <ul id="category-menu">
          <li class="active" data-category="all" role="button" tabindex="0"><i class="bi bi-house-door" aria-hidden="true"></i> 全部</li>
          <!-- 动态生成的分类菜单项 -->
        </ul>


        <!-- 皮肤选择器 -->
        <div class="skin-selector" id="skin-selector">
          <button type="button" class="current-skin" aria-label="选择页面主题">
            <div class="current-skin-preview">
              <i class="bi bi-stars current-skin-icon" aria-hidden="true"></i>
            </div>
            <span class="current-skin-name">深空灰</span>
            <span class="skin-expand-btn" aria-hidden="true">
              <i class="bi bi-chevron-down"></i>
            </span>
          </button>

          <div class="skin-options">
            <div class="skin-grid">
              <div class="skin-option active" data-skin="neon">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">深空灰</span>
              </div>

              <div class="skin-option" data-skin="ocean">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">海洋蓝调</span>
              </div>

              <div class="skin-option" data-skin="forest">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">森林绿意</span>
              </div>

              <div class="skin-option" data-skin="sunset">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">日落橙黄</span>
              </div>

              <div class="skin-option" data-skin="purple">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">优雅紫色</span>
              </div>

              <div class="skin-option" data-skin="classic">
                <div class="skin-colors">
                  <div class="color-dot primary"></div>
                  <div class="color-dot secondary"></div>
                  <div class="color-dot accent"></div>
                </div>
                <span class="skin-label">经典灰调</span>
              </div>
            </div>

          </div>
        </div>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部信息区 -->
      <header class="top-info dashboard-header">
        <div class="workspace-intro">
          <p><strong id="site-count">--</strong> 个站点 <span aria-hidden="true">·</span> <strong id="category-count">--</strong> 个分类</p>
        </div>
        <div class="time-info">
          <div class="current-time" id="current-time">--:--:--</div>
          <div class="date-info" id="date-info">加载中...</div>
        </div>
      </header>

      <section class="search-panel" aria-label="搜索">
        <div class="search-capsule">
          <select id="search-engine" aria-label="选择网络搜索引擎" title="选择网络搜索引擎">
            <option value="bing">必应</option>
            <option value="baidu">百度</option>
            <option value="google">Google</option>
            <option value="github">GitHub</option>
            <option value="bilibili">Bilibili</option>
          </select>
          <div class="site-search">
            <i class="bi bi-search search-symbol" aria-hidden="true"></i>
            <input id="site-search-input" type="search" autocomplete="off" placeholder="搜索网站、分类或域名" aria-label="搜索导航网站">
            <kbd>Ctrl K</kbd>
          </div>
          <button id="web-search-btn" type="button" title="使用所选引擎搜索">
            <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
            <span>搜索</span>
          </button>
        </div>
        <div class="search-actions search-secondary-actions">
          <button id="view-mode-toggle" class="view-mode-toggle" type="button" aria-pressed="false" title="切换到紧凑视图">
            <i class="bi bi-grid" aria-hidden="true"></i>
            <span>紧凑</span>
          </button>
          <button id="manage-links-btn" class="manage-links-btn" type="button" aria-pressed="false">管理</button>
        </div>
      </section>

      <!-- 添加链接按钮 -->
      <button id="add-link-btn" class="add-link-btn" aria-label="添加网站">
        <i class="bi bi-plus"></i>
      </button>

      <!-- 工具图标列表 -->
      <div class="tools-container">
        <div id="tools-grid" class="tools-grid">
          <!-- 动态生成的工具图标 -->
        </div>
      </div>
    </main>
  </div>

  <!-- 添加链接模态框 -->
  <div id="add-link-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>添加网站</h2>
        <button id="close-modal-btn" class="close-modal-btn" aria-label="关闭">
          <i class="bi bi-x"></i>
        </button>
      </div>

      <div class="modal-body">
        <form id="add-link-form">
          <div class="form-group">
            <label for="site-url">网站网址 *</label>
            <input type="url" id="site-url" name="site-url" value="https://" placeholder="请输入完整网址，包含http://或https://">
            <div class="error-message" id="url-error"></div>
            <div id="favicon-preview" class="favicon-preview" hidden>
              <span class="favicon-preview-icon">
                <img id="favicon-preview-image" src="img/logo.png" alt="" hidden>
                <span id="favicon-preview-fallback" aria-hidden="true">?</span>
              </span>
              <span class="favicon-preview-copy">
                <span class="favicon-preview-title">
                  <strong>自动匹配图标</strong>
                  <span>多源抓取</span>
                </span>
                <small id="favicon-preview-status">正在识别图标…</small>
                <small id="favicon-preview-domain" class="favicon-preview-domain"></small>
              </span>
              <button id="refresh-favicon-btn" type="button">重新抓取</button>
            </div>
          </div>
          <div class="form-group">
            <label for="site-name">网站名称 *</label>
            <input type="text" id="site-name" name="site-name" placeholder="请输入网站名称" maxlength="50">
            <div class="error-message" id="name-error"></div>
          </div>
          <div class="form-group">
            <label for="site-category">分类 *</label>
            <select id="site-category" name="site-category">
              <!-- 动态生成的分类选项 -->
            </select>
            <div id="custom-category-container" style="display: none; margin-top: 10px;">
              <input type="text" id="custom-category" name="custom-category" placeholder="请输入自定义分类名称" maxlength="20">
            </div>
            <div class="error-message" id="category-error"></div>
          </div>

          <div class="form-group">
            <label for="site-sort">排序 (可选)</label>
            <input type="number" id="site-sort" name="site-sort" placeholder="数字越小，排序越靠前" min="0" max="999" value="200">
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button id="cancel-add-btn" class="cancel-btn">取消</button>
        <button id="save-link-btn" class="save-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div id="delete-link-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>确认删除</h2>
        <button id="close-delete-modal-btn" class="close-modal-btn" aria-label="关闭">
          <i class="bi bi-x"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="delete-confirmation">
          <div class="delete-icon">
            <i class="bi bi-exclamation-triangle"></i>
          </div>
          <p>确定要删除网站 <span id="delete-site-name" class="site-name-highlight"></span> 吗？</p>
          <p class="delete-warning">此操作不可撤销。</p>
        </div>
      </div>

      <div class="modal-footer">
        <button id="cancel-delete-btn" class="cancel-btn">取消</button>
        <button id="confirm-delete-btn" class="delete-btn">确认删除</button>
      </div>
    </div>
  </div>

  <div id="command-palette" class="command-palette" hidden>
    <section class="command-palette-dialog" role="dialog" aria-modal="true" aria-labelledby="command-palette-title">
      <header class="command-palette-header">
        <i class="bi bi-search" aria-hidden="true"></i>
        <label id="command-palette-title" class="sr-only" for="command-palette-input">快速搜索网站</label>
        <input id="command-palette-input" type="search" autocomplete="off" placeholder="输入网站、分类、域名或拼音">
        <button id="command-palette-close" type="button" aria-label="关闭快速搜索">Esc</button>
      </header>
      <div id="command-palette-results" class="command-palette-results" role="listbox" aria-label="搜索结果"></div>
      <p id="command-palette-empty" class="command-palette-empty" hidden>没有找到匹配的网站</p>
      <footer class="command-palette-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>Enter</kbd> 新标签打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </footer>
    </section>
  </div>

  <script src="vendor/pinyin-match/pinyin-match.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
